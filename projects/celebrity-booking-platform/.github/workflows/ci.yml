name: Aurum CI

on:
  push:
    branches: ["**"]
    paths: ["projects/celebrity-booking-platform/**"]
  pull_request:
    paths: ["projects/celebrity-booking-platform/**"]

defaults:
  run:
    working-directory: projects/celebrity-booking-platform

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-secret-not-for-production"
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/celebrity-booking-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npx prisma db push && npx prisma db seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-secret-not-for-production"
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/celebrity-booking-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        run: npx prisma db push && npx prisma db seed

      - name: End-to-end smoke tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: projects/celebrity-booking-platform/playwright-report/
          retention-days: 7
